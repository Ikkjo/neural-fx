version: "1.0"
name: "gru_nano"

model:
  type: "gru"
  input_size: 1
  output_size: 1
  sample_rate: 48000
  params:
    hidden_size: 20
    num_layers: 1
    conv1d:
      filters: 16
      kernel_size: 3
      stride: 4
    skip_connection: false
    dropout: 0.0

training:
  batch_size: 32
  epochs: 100
  segment_length: 8192
  tbptt:
    enabled: true
    burn_in: 4096
  seed: 42

optimizer:
  type: "adam"
  lr: 0.01

lr_scheduler:
  type: "exponential"
  gamma: 0.995

loss:
  type: "mse"
  weights:
    esr: 0.0
    mse: 1.0
  pre_emphasis:
    enabled: true
    coef: 0.85
  mask_first: 4096

data:
  train:
    input: "data/DI.wav"
    target: "data/effect.wav"
  sample_rate: 48000
