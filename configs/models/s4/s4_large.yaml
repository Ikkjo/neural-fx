version: "1.0"
name: "s4_large"

model:
  type: "s4"
  input_size: 1
  output_size: 1
  sample_rate: 48000
  params:
    d_model: 64
    d_state: 128
    num_layers: 6
    dropout: 0.0
    prenorm: true

training:
  batch_size: 8
  epochs: 100
  segment_length: 8192
  tbptt:
    enabled: true
    burn_in: 4096
  seed: 42

optimizer:
  type: "adam"
  lr: 0.001

lr_scheduler:
  type: "exponential"
  gamma: 0.995

loss:
  type: "mse"
  weights:
    esr: 0.0
    mse: 1.0
  mask_first: 4096

data:
  train:
    input: "data/DI.wav"
    target: "data/effect.wav"
