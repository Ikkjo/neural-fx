version: "1.0"
name: "lstm_nano_nam"

model:
  type: "lstm"
  input_size: 1
  output_size: 1
  sample_rate: 48000
  params:
    hidden_size: 20
    num_layers: 1
    conv1d:
      filters: 16
      kernel_size: 3
      stride: 4
    skip_connection: false
    dropout: 0.0

training:
  batch_size: 32
  epochs: 100
  segment_length: 8192
  tbptt:
    enabled: true
    burn_in: 4096
  seed: 42

optimizer:
  type: "adam"
  lr: 0.01

lr_scheduler:
  type: "exponential"
  gamma: 0.995

loss:
  type: "mse"
  weights:
    esr: 0.0
    mse: 1.0
  pre_emphasis:
    enabled: true
    coef: 0.85
  mask_first: 4096

# NAM-specific configuration
latency:
  enabled: true
  method: "blip"  # Use blip detection for NAM inputs
  manual_delay: null
  max_delay: 10000

validation:
  enabled: true
  check_clipping: true
  check_dc_offset: true
  check_replicability: true
  ignore_warnings: false

data:
  train:
    input: "data/nam_input_v3.wav"  # NAM v3 standard input
    target: "data/nam_output.wav"
  val:
    input: "data/nam_input_v3.wav"
    target: "data/nam_output.wav"
  sample_rate: 48000
