  type: combined
  weights:
    esr: 1.0
    mse: 0.0
    stft: 0.0
  esr_mode: nam
  pre_emphasis:
    enabled: false
  mask_first: 4096
data:
  normalize: false
  train:
    input: local/full_rig_latency_44100/data/full_rig_delay_000/data/train/input.wav
