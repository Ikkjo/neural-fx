name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / Torch 2.11 CPU
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install PyTorch CPU runtime
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          "torch==2.11.*" "torchaudio==2.11.*"
      - name: Install neural-fx and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run core test suite
        run: pytest tests

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Ruff
        run: python -m pip install "ruff>=0.11,<0.17"
      - name: Lint
        run: ruff check neural_fx scripts tests setup.py
